<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altar of Democracy · online</title>
<meta name="description" content="Politics – Altar of Democracy: a parliament game to play with friends over several days.">
<meta name="theme-color" content="#f2ebdd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One fixed look on every phone, whatever its dark or light setting (decided 5 Oct): the art bible's palette.
     Paper #F2EBDD, ink #172B3A, slate for secondary text, teal for selection and actions, alert red for trouble. */
  :root {
    color-scheme: light;
    --page: #f2ebdd;
    --surface: #fbf7ef;
    --surface-2: #f6f0e4;
    --ink: #172b3a;
    --ink-2: #44535e;
    --muted: #5e6b74;
    --hairline: #ded3c0;
    --axis: #c2b59e;
    --accent: #276d6b;
    --accent-ink: #ffffff;
    --accent-soft: #d5e5e1;
    --yes: #1d7a47;
    --yes-soft: #dcebdd;
    --no: #b7453e;
    --no-soft: #f3dcd6;
    --warn: #8c5a12;
    --warn-soft: #f1e2c4;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #9b1d3c; --s8: #6b5443;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  #app { min-height: 100%; }
  .page { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 16px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 9vw, 60px); letter-spacing: -0.015em; color: var(--accent); }
  h2 { font-family: var(--display); font-weight: 700; font-size: 26px; }
  h3 { font-size: 17px; font-weight: 600; }
  p { margin: 0; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .lead { font-size: 18px; color: var(--ink-2); }
  .muted, .hint { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }

  button { font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.link { background: none; border: none; padding: 4px 0; color: var(--ink-2); text-decoration: underline; justify-self: start; font-weight: 500; }
  :focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
  input[type="text"] { font: inherit; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-2); color: var(--ink); width: 100%; box-sizing: border-box; }
  .field-label { font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  /* Intro */
  .intro { padding-top: 48px; }
  .intro .resume { border-color: var(--accent); }
  details.how { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px 16px; }
  details.how summary { cursor: pointer; font-weight: 600; }
  details.how ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); }

  /* Questionnaire */
  .progress { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); }
  .statement { font-size: clamp(24px, 5.5vw, 32px); padding-block: 24px 8px; }
  .answers { display: grid; gap: 8px; }
  .answer { text-align: left; }
  .answer.picked { border-color: var(--accent); background: var(--accent-soft); }

  /* Party choice */
  .compass { margin: 0; max-width: 360px; justify-self: center; width: 100%; }
  .compass svg { width: 100%; height: auto; display: block; }
  .axis-t { font-size: 11px; fill: var(--muted); font-family: var(--sans); }
  .pmark circle { stroke: var(--surface); stroke-width: 2; }
  .pmark.hl circle { stroke: var(--ink); stroke-width: 2.5; }
  .pmark-t { font-size: 8px; font-weight: 700; fill: #fff; font-family: var(--sans); }
  .you { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .you-t { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--sans); }
  .party-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .party-option { grid-template-columns: 1fr auto; align-items: center; }
  .party-option.best { border-color: var(--accent); }
  .party-option button { grid-column: 1 / -1; justify-self: start; }
  .party-name { display: flex; gap: 10px; align-items: center; }
  .party-name small { display: block; color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
  .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Party colours */
  .p1 { --pc: var(--s1); } .p2 { --pc: var(--s2); } .p3 { --pc: var(--s3); } .p4 { --pc: var(--s4); } .p5 { --pc: var(--s5); } .p6 { --pc: var(--s6); } .p7 { --pc: var(--s7); } .p8 { --pc: var(--s8); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; }
  .dot.big { width: 18px; height: 18px; }
  .pmark circle, .seat { fill: var(--pc); }
  .party-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; min-width: 58px; }

  /* Top bar */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--hairline); padding: 8px 16px 10px; display: grid; gap: 6px; }
  .topline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; max-width: 680px; width: 100%; margin: 0 auto; }
  .topline .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .topline .where { color: var(--muted); }
  .scorebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 680px; width: 100%; margin: 0 auto; }
  .score { display: grid; gap: 1px; min-width: 0; }
  .score .label { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score .value { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }
  .meter { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--yes); }

  /* Motions */
  .motion h3 { font-family: var(--display); font-weight: 700; font-size: 21px; }
  .motion-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .motion-no { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .axis { border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 8px; }
  .weight { display: inline-flex; gap: 3px; margin-left: auto; }
  .weight i { width: 8px; height: 8px; border-radius: 50%; background: var(--hairline); }
  .weight i.on { background: var(--accent); }
  .advisors { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .advisor { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
  .advisor b { color: var(--ink); font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--hairline); color: var(--ink-2); }
  .advisor.yes { background: var(--yes-soft); } .advisor.yes .avatar { background: var(--yes); color: #fff; }
  .advisor.no { background: var(--no-soft); } .advisor.no .avatar { background: var(--no); color: #fff; }
  .advisor.warn { background: var(--warn-soft); } .advisor.warn .avatar { background: var(--warn); color: #fff; }
  .ask { font-weight: 600; font-size: 14px; margin-top: 4px; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg { padding: 12px 8px; }
  .seg.picked.for { background: var(--yes); border-color: var(--yes); color: #fff; }
  .seg.picked.against { background: var(--no); border-color: var(--no); color: #fff; }
  .seg.picked.abstain { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
  .press { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; padding: 8px 10px; border: 1px dashed var(--axis); border-radius: 8px; cursor: pointer; }
  .press.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .press input { width: 18px; height: 18px; accent-color: var(--accent); }
  .press-left { font-weight: 600; color: var(--accent); }

  .line-result { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .line-chip { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
  .line-chip.yes { background: var(--yes); color: #fff; }
  .line-chip.no { background: var(--no); color: #fff; }
  .tally { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .other-lines { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; }
  .mini { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }

  /* Results */
  .deltas { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .delta { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; }
  .delta .label { font-size: 12px; color: var(--muted); }
  .delta .value { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .delta.up .value { color: var(--yes); }
  .delta.down .value { color: var(--no); }
  .you-voted { font-size: 14px; color: var(--ink-2); }
  .explain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .explain li { padding-left: 12px; border-left: 3px solid var(--hairline); color: var(--ink-2); }
  .explain li.up { border-left-color: var(--yes); }
  .explain li.down { border-left-color: var(--no); }
  .alarm { border-color: var(--no); background: var(--no-soft); }
  .fate.kept { border-color: var(--yes); }
  .fate.seat, .fate.collapse, .fate.ballot { border-color: var(--no); }
  .off-ballot { color: var(--no); font-weight: 600; }
  .fate.retired { border-color: var(--accent); }
  /* the art layer: pictures by name, placeholders drawn in code until the artwork exists */
  .art { margin: 0; display: block; }
  .art img { display: block; width: 100%; border-radius: 12px; }
  .art.banner { margin: 2px 0 12px; }
  .art.banner svg { display: block; width: 100%; height: 84px; }
  .art.banner img { height: clamp(110px, 19vh, 200px); object-fit: cover; object-position: 50% 50%; }
  .art-placeholder { color: var(--ink-2); }
  .art-placeholder .ln { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
  .art-placeholder .ln.thick { stroke-width: 3.5; }
  .art-placeholder .soft { fill: var(--surface-2); stroke: none; }
  .art-placeholder .paper { fill: var(--surface); stroke: none; }
  .art-placeholder .accent { fill: var(--accent); opacity: 0.8; stroke: none; }
  .art-placeholder .accent-ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .art-placeholder .frame { fill: none; stroke: currentColor; stroke-width: 3; opacity: 0.8; }
  .art-placeholder .bar { fill: currentColor; opacity: 0.45; }
  .art-placeholder .confetti { fill: var(--accent); opacity: 0.7; }
  .cutscene .cs-art { margin: 0 auto 4px; width: 100%; max-width: 420px; color: var(--cs-muted); }
  .cutscene .cs-art svg { display: block; width: 100%; height: 96px; }
  .cutscene .cs-art .soft { fill: var(--cs-card); }
  .cutscene .cs-art .paper { fill: #22394a; }
  .cs-art-ballot { margin: 0 auto; }
  /* Real pictures in the cut scenes and the press room (batch 2, 4 Oct 2026); the drawn placeholders keep the rules above. */
  .cutscene .cs-art img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); }
  .cs-intro .art.cs-art-ballot:not(.art-placeholder) { width: min(240px, 62vw); }
  .cs-intro .art.cs-art-ballot img { border-radius: 16px; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5); animation: cs-in 0.6s ease-out both; }
  .press-hero .art:not(.art-placeholder) { width: calc(100% + 24px); margin: -14px -12px 6px; }
  .press-hero .art img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px 12px 0 0; }
  /* a name that opens a profile */
  .name-link { all: unset; cursor: pointer; font: inherit; color: inherit; text-decoration: underline dotted var(--ink-2); text-underline-offset: 3px; }
  .name-link:hover, .name-link:focus-visible { text-decoration-style: solid; color: var(--accent); }
  .name-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .face-link { all: unset; cursor: pointer; display: inline-flex; vertical-align: middle; border-radius: 50%; }
  .face-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; padding: 16px 16px 28px; box-shadow: 0 -8px 30px rgba(0,0,0,0.25); display: grid; gap: 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet-head h3 { margin: 0; font-size: 20px; }
  .sheet-close { width: 36px; height: 36px; border-radius: 50%; padding: 0; font-size: 22px; line-height: 1; }
  .profile-ranks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .profile-ranks > div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .profile-ranks small { display: block; font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .profile-ranks b { font-size: 22px; }
  .profile-ranks span { color: var(--ink-2); font-size: 13px; }
  .profile-scores { width: 100%; border-collapse: collapse; font-size: 14px; }
  .profile-scores th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 0; }
  .profile-scores td { padding: 6px 0; border-top: 1px solid var(--hairline); }
  .profile-scores td:nth-child(2) { font-weight: 700; font-variant-numeric: tabular-nums; }
  /* the dynasty */
  .dynasty { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .dynasty-card { display: grid; gap: 6px; }
  .dynasty-card.in-office { border-color: var(--accent); }
  .dyn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dyn-name { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .dyn-badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .dyn-badge.retired { background: var(--yes-soft); color: var(--yes); }
  .dyn-badge.fell { background: var(--no-soft); color: var(--no); }
  .dyn-badge.in-office { background: var(--accent-soft); color: var(--accent); }
  .retake .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  .retiring { color: var(--ink-2); font-weight: 600; }
  .personal-votes { color: var(--warn); font-weight: 600; }
  /* coalitions: the cabinet room, the strain meter, the crisis vote, the verdict on ministers */
  .roomnav.five { grid-template-columns: repeat(5, 1fr); }
  .roomnav.five .roomlabel { font-size: 11px; }
  .role-badge.minister { color: var(--accent-ink); background: var(--accent); }
  .strain { display: grid; gap: 6px; margin: 4px 0 12px; }
  .strain-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .strain-seg { height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--hairline); }
  .strain-seg.on.l1 { background: #6fae7a; border-color: #6fae7a; }
  .strain-seg.on.l2 { background: #b8b34a; border-color: #b8b34a; }
  .strain-seg.on.l3 { background: #d9922e; border-color: #d9922e; }
  .strain-seg.on.l4 { background: #d8622f; border-color: #d8622f; }
  .strain-seg.on.l5 { background: #c0302c; border-color: #c0302c; }
  .strain-seg.here { outline: 2px solid var(--ink); outline-offset: 1px; }
  .strain.fell .strain-seg { background: var(--no-soft, #f3d6d6); border-color: var(--no, #b3121f); }
  .strain-label { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .strain-label small { font-family: inherit; font-weight: 500; font-size: 13px; color: var(--ink-2); }
  .coalition-parties { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
  .card.crisis { border-color: var(--accent); background: var(--accent-soft); }
  .card.crisis .row, .verdict .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.primary.danger { background: #c0302c; border-color: #c0302c; }
  .verdict.good { border-color: #6fae7a; }
  .verdict.bad { border-color: #c0302c; }
  .verdict h3 { font-family: var(--display); font-size: 20px; }
  .verdict .offer button { flex: 1 1 140px; padding: 14px; font-size: 16px; }
  /* party roles: tags, the roles card, volunteering */
  .role-tag { color: var(--accent); font-weight: 600; }
  .role-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  .roles.holder { border-color: var(--accent); }
  .role-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
  .role-list li { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; align-items: baseline; }
  .role-list .role-name { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .volunteer { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; cursor: pointer; }
  .volunteer input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
  .volunteer span { display: grid; gap: 4px; }
  .volunteer small { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
  /* careers: the new politician's party, standing down */
  .party-choice { display: grid; gap: 8px; margin-top: 4px; }
  .join-option { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: center; text-align: left; padding: 10px 12px; }
  .join-option .jo-name { font-weight: 600; }
  .join-option .jo-note { grid-column: 2; color: var(--ink-2); font-size: 13px; }
  .join-option.here { border-color: var(--accent); background: var(--accent-soft); }
  .career .career-note { font-size: 14px; }
  .career .confirm { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
  .career .confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }

  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
  .bar-track { height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
  .bar-track i { display: block; height: 100%; background: var(--pc); border-radius: 0 4px 4px 0; }
  .bar-val { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
  .hemicycle { margin: 0; }
  .hemicycle svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
  .seat { stroke: var(--surface); stroke-width: 1.5; }

  .sticky-actions { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--page) 30%); display: flex; flex-wrap: wrap; gap: 10px; }
  .sticky-actions .primary { flex: 1 1 auto; padding: 14px 18px; font-size: 16px; }

  @media (max-width: 420px) {
    .score .label { font-size: 10px; }
    .score .value { font-size: 14px; }
    .motion h3 { font-size: 19px; }
  }
  @media (prefers-reduced-motion: no-preference) {

  .rooms.has-backdrop { --stage-h: max(150px, 34vh); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --peek-h: calc(52px + env(safe-area-inset-bottom, 0px)); }
  .room-backdrop { position: fixed; inset: 0; z-index: 0; background: #172b3a; overflow: hidden; }

    transform: translateY(calc(var(--shift, 0vh) * -1)); transition: transform 0.8s var(--ease); }
  .room-backdrop::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; pointer-events: none;

    transition: transform 0.5s var(--ease), opacity 0.4s; }
  .rooms.has-backdrop .room-page { position: relative; z-index: 1; gap: 0; padding-top: 0; padding-bottom: 0; padding-inline: 0; }
  .room-stage { height: var(--stage-h); }
  .room-sheet { display: grid; gap: 12px; align-content: start; min-width: 0; padding: 16px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
    min-height: calc(100vh - var(--stage-h)); background: var(--page); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(23, 43, 58, 0.28);
    transition: transform 0.7s var(--ease), opacity 0.4s; }

    background: transparent; border: none; border-radius: 0; touch-action: none; cursor: pointer; }

    padding: 9px 16px 0; border-radius: 18px 18px 0 0; background: var(--page); color: var(--muted); box-shadow: 0 -10px 30px rgba(23, 43, 58, 0.28);
    font-size: 13px; font-weight: 600; }

  .room-caption { position: fixed; left: 0; right: 0; bottom: max(14vh, 90px); z-index: 2; display: grid; justify-items: center; gap: 4px; padding-inline: 24px;
    color: #f2ebdd; text-align: center; pointer-events: none; opacity: 0; transform: translateY(12px); transition: opacity 0.4s, transform 0.6s var(--ease); }
  .room-caption h2 { font-family: var(--display); font-size: clamp(34px, 10vw, 52px); line-height: 1; color: #f2ebdd; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }

  .rooms.lowered .room-backdrop .art img { transform: none; }

  .press-row.hot .press-effect .avatar { background: var(--yes-soft); color: var(--yes); border-color: var(--yes); }
  .press-row.none .press-effect .avatar { background: var(--no-soft); color: var(--no); border-color: var(--no); }
  /* Advisor faces (the art bible's cast, 4 Oct 2026): round crops in place of the initials. */
  .avatar.face { padding: 0; overflow: hidden; background: #e9e0cd; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--hairline); }
  .avatar.face img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .advisor.with-face { grid-template-columns: 44px 1fr; align-items: center; }
  .advisor.with-face .avatar.face { width: 44px; height: 44px; }
  .press-effect .avatar.face { width: 48px; height: 48px; border-width: 2px; }
  .press-row.hot .press-effect .avatar.face { border-color: var(--yes); background: #e9e0cd; }
  .press-row.none .press-effect .avatar.face { border-color: var(--no); background: #e9e0cd; }
  .adv-badge .avatar.face { width: 28px; height: 28px; border-width: 1.5px; }
  .card-advisor { display: flex; align-items: center; gap: 8px; margin: -2px 0 2px; }
  .card-advisor .avatar.face { width: 38px; height: 38px; }
  .card-advisor small { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  /* Politicians' faces (decided 4 Oct 2026): 15 portraits from the art bible's concept sheets. */
  .face-chooser { display: grid; grid-template-columns: repeat(5, 1fr); align-content: start; gap: 8px; margin: 4px 0 6px; max-height: 236px; overflow-y: auto; padding: 4px; overscroll-behavior: contain; }
  /* Square buttons whatever the row height (the faces load lazily and give no height of their own). */
  .face-chooser .face-option { position: relative; align-self: start; width: 100%; height: 0; padding: 0 0 calc(100% - 4px); aspect-ratio: auto; }
  .face-chooser .face-option > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* A round face cut from a waist-up figure (5 Oct 2026): the figure placed so its face fills the circle. */
  .portrait-face.cut { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; background: #efe6d4; }
  .portrait-face.cut img { position: absolute; max-width: none; height: auto; }
  .face-chooser .face-option > .portrait-face.cut { position: absolute; }
  .face-option { padding: 0; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 2px solid var(--hairline); background: #efe6d4; }
  .face-option img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .face-option.picked { border: 3px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .face-dot { display: inline-block; vertical-align: middle; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #efe6d4; border: 1.5px solid var(--hairline); flex: none; }
  .face-dot.small { width: 26px; height: 26px; }
  /* A politician's face ringed in their party's colour, where a coloured dot stood beside a name (11 Oct 2026). */
  .face-dot.ring { border: 2px solid var(--pc); }
  .role-badge.mp { color: var(--ink-2); background: var(--surface-2); }
  .face-dot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .topline .who .face-dot { margin-right: 2px; }
  .dyn-name .face-dot { margin-right: 6px; }
  .newcomer-scene .page { padding-bottom: 120px; }
  .newcomer-scene .card { display: grid; gap: 8px; }
  /* People standing in the room's painting, each with a line (4 Oct 2026): one at the right, or two at either side. */
  .rooms.has-backdrop .room-stage { position: relative; }
  .rooms.has-backdrop .room-sheet { position: relative; z-index: 1; }
  .room-advisor { --fig-h: min(250px, calc(var(--stage-h) * 0.86)); position: absolute; inset: 0; pointer-events: none; transition: opacity 0.4s 0.35s, transform 0.6s 0.35s var(--ease); }
  .room-advisor .advisor-portrait { position: absolute; right: 4px; bottom: -22px; height: var(--fig-h); width: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35)); }
  .room-advisor .advisor-portrait.figure { height: calc(var(--fig-h) * 0.9); }
  .room-advisor-lines { position: absolute; z-index: 1; left: 12px; bottom: 30px; max-width: calc(100% - min(220px, calc(var(--stage-h) * 0.72)) - 8px); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .room-advisor-says { margin: 0; padding: 9px 12px; border-radius: 14px 14px 4px 14px;
    background: rgba(242, 235, 221, 0.96); color: #172b3a; font-size: 13.5px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); pointer-events: auto; }
  .room-advisor-says b { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #276d6b; }
  .room-advisor.duo { --fig-h: min(210px, calc(var(--stage-h) * 0.74)); }
  .room-advisor.duo .figure-0 { right: -16px; }
  .room-advisor.duo .figure-1 { right: auto; left: -16px; }
  .room-advisor.duo .room-advisor-lines { left: calc(var(--fig-h) * 0.5); right: calc(var(--fig-h) * 0.5); max-width: none; align-items: stretch; }
  /* Two speakers (the owner's report of 11 Oct 2026: the bubbles crowded the people, and whose line was whose was
     unclear): each bubble fits its text, leans to its speaker's side, carries their small face, and points at them with
     a tail. The upper bubble is the left figure's, the lower one the right figure's. */
  .room-advisor.duo .room-advisor-says { position: relative; border-radius: 14px; }
  .room-advisor.duo .says-1 { align-self: flex-start; }
  .room-advisor.duo .says-0 { align-self: flex-end; }
  .room-advisor.duo .room-advisor-says::after { content: ""; position: absolute; width: 0; height: 0; border: 9px solid transparent; }
  .room-advisor.duo .says-1::after { left: -18px; bottom: 12px; border-right-color: rgba(242, 235, 221, 0.96); }
  .room-advisor.duo .says-0::after { right: -18px; top: 12px; border-left-color: rgba(242, 235, 221, 0.96); }
  .room-advisor-says b .face-dot.tiny { width: 20px; height: 20px; margin: -3px 6px 0 0; vertical-align: middle; }
  /* With the sheet pushed down the people stay (asked 5 Oct 2026): the stage becomes the whole screen above the sheet's
     strip, so they stand at its foot, cut off behind the strip as they were behind the sheet; the room's name goes to the top. */
  .rooms.lowered .room-stage { position: fixed; left: 0; right: 0; top: 0; bottom: calc(var(--peek-h) - 18px); height: auto; pointer-events: none; }
  .rooms.lowered .room-advisor-lines { bottom: 48px; }
  .rooms.lowered .room-advisor.duo .room-advisor-lines { bottom: 34px; }
  .rooms.lowering .room-advisor { animation: cs-in 0.45s ease-out 0.55s both; }
  .rooms.raising .room-advisor { animation: cs-in 0.45s ease-out 0.4s both; }
  .rooms.lowered:has(.room-advisor) .room-caption { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 7vh); }
  .rooms.lowered:has(.room-advisor) .room-backdrop::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 36%; z-index: 1; pointer-events: none;
    background: linear-gradient(rgba(23, 43, 58, 0.78), rgba(23, 43, 58, 0.35) 55%, transparent); }
  /* Sized by the screen, not by the strip of painting above the sheet, so they keep their size on small phones. */
  .rooms.lowered .room-advisor { --fig-h: min(250px, 34vh); }
  .rooms.lowered .room-advisor.duo { --fig-h: min(210px, 30vh); }
  .rooms.lowered .room-advisor-lines { max-width: calc(100% - min(220px, 25vh) - 8px); }
  @media (max-height: 700px) {
    .room-advisor-says { font-size: 12.5px; } .room-advisor-lines { bottom: 22px; }
    .room-advisor.duo .room-advisor-lines { bottom: 14px; gap: 4px; } .room-advisor.duo .room-advisor-says { padding: 6px 10px; line-height: 1.3; }
    .room-advisor.duo .room-advisor-says b { font-size: 10px; }
    .rooms.lowered .room-advisor-lines { bottom: 40px; } .rooms.lowered .room-advisor.duo .room-advisor-lines { bottom: 32px; }
  }
  .press-row button { justify-self: start; }

  /* compact rows */
  .rows { display: grid; gap: 6px; }
  .row-fold { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 8px 10px; }
  .row-fold > summary { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
  .row-fold > summary::-webkit-details-marker { display: none; }
  .row-fold[open] > summary { margin-bottom: 8px; }
  .row-fold[open] .row-open { transform: rotate(180deg); }
  .row-fold > *:not(summary) { margin-top: 6px; }
  .row-main { display: grid; gap: 3px; min-width: 0; }
  .row-text { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .row-fold:not([open]) .row-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row-open { color: var(--muted); font-size: 12px; transition: transform 0.15s; }
  .mark { display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 8px; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
  .mark.yes { background: var(--yes); color: #fff; } .mark.no { background: var(--no); color: #fff; }
  .mark.free { background: var(--surface-2); color: var(--ink-2); border: 1px dashed var(--ink-2); }
  .mark.num.for { background: var(--yes); color: #fff; } .mark.num.against { background: var(--no); color: #fff; } .mark.num.abstain { background: var(--ink-2); color: var(--surface); }
  .minibar { display: inline-flex; width: 90px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--hairline); }
  .minibar i { display: block; height: 100%; }
  .minibar .yes { background: var(--yes); } .minibar .no { background: var(--no); } .minibar .abs { background: var(--ink-2); } .minibar .miss { background: var(--axis); }
  .party-votes { gap: 3px; }
  .pv { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 4px; color: #fff; }
  .pv.yes { background: var(--yes); } .pv.no { background: var(--no); }
  .delta-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .dchip { display: grid; justify-items: center; padding: 6px 2px; border-radius: 8px; background: var(--surface-2); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .dchip small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .dchip.up { color: var(--yes); } .dchip.down { color: var(--no); }
  .desk-now { display: grid; gap: 6px; }
  .desk-now button { justify-self: start; }
  .card h3 + p { margin-top: -4px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .pill.here { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .risk-note { font-size: 14px; color: var(--ink-2); }
  .risk-note.danger { color: var(--no); font-weight: 600; }
  .chat-list.tall { max-height: 55vh; }
  .chat-input { position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); background: var(--page); padding-top: 6px; }
  @media (max-width: 480px) {
    .page { padding-inline: 12px; }
    .room-sheet { padding-inline: 12px; }
    .card { padding: 12px; gap: 10px; border-radius: 10px; }
    .motion h3 { font-size: 19px; }
  }

  .roomhead-line { flex-wrap: wrap; row-gap: 2px; }
  .roomhead-line h2 { white-space: nowrap; }
  .audience { font-size: 10px; white-space: nowrap; }
  .notice-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 14px;
    background: var(--no-soft); border-color: var(--no); color: var(--no); padding: 10px 12px; }
  .notice-line span { font-size: 20px; line-height: 1; }

  /* ---- the cut scene after each session ---- */
  /* The cut scenes in the art bible's ink blue, with teal for progress and actions (decided 5 Oct). */
  .cutscene { --cs-bg: #0f1d28; --cs-ink: #f2ebdd; --cs-muted: #a3b0b9; --cs-line: #2c4150; --cs-up: #5cc08a; --cs-down: #ef8a7f; --cs-card: #172b3a;
    position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(120% 80% at 50% 0%, #234257 0%, var(--cs-bg) 60%);
    color: var(--cs-ink); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; gap: 14px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .cutscene > * { width: 100%; max-width: 560px; margin: 0 auto; }
  .cs-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cs-muted); }
  .cs-skip { background: none; border: 1px solid var(--cs-line); color: var(--cs-muted); padding: 5px 12px; font-size: 12px; }
  .cs-steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
  .cs-step { background: none; border: none; border-top: 3px solid var(--cs-line); border-radius: 0; color: var(--cs-muted); font-size: 12px; padding: 6px 0 0; text-align: left; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* Many steps on a narrow phone: the bars stay, only the current step keeps its name (5 Oct 2026). */
  @media (max-width: 480px) { .cs-steps:has(> :nth-child(6)) .cs-step:not(.here) { color: transparent; } .cs-steps:has(> :nth-child(6)) .cs-step.here { overflow: visible; } }
  .cs-step.done { border-top-color: #2a5c5b; color: var(--cs-ink); }
  .cs-step.here { border-top-color: #4fb3ad; color: var(--cs-ink); }
  /* The media exposure scene (4 Oct 2026): each outlet keeps its own look (the art bible's fictional outlets). */
  .cs-media { display: grid; gap: 14px; }
  .media-card { border-radius: 12px; overflow: hidden; background: #f2ebdd; color: #172b3a; border: 1px solid #d9cdb5; animation: cs-in 0.45s ease-out both; animation-delay: var(--d, 0s); }
  .media-card .art { margin: 0; }
  /* A window onto one person in a picture of several (art/people-AAA.webp, 5 Oct 2026): it keeps its own shape. */
  .sheet-window { display: block; position: relative; overflow: hidden; }
  .sheet-window > img { position: absolute; height: auto; max-width: none; }
  .room-advisor .advisor-portrait.sheet-window { width: auto; }
  /* A politician's waist-up window is wide (elbows and hands in, 5 Oct 2026): it reaches past the edge of the screen so the
     person stands where a narrow one would, its sides fade out, and the stage clips what lies beyond. */
  .room-advisor { overflow: hidden; }
  .room-advisor .advisor-portrait.figure.sheet-window { right: calc(4px - var(--fig-h) * 0.9 * 0.295);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%); }
  .room-advisor.duo .figure-0.figure.sheet-window { right: calc(-16px - var(--fig-h) * 0.9 * 0.295); }
  .room-advisor.duo .figure-1.figure.sheet-window { right: auto; left: calc(-16px - var(--fig-h) * 0.9 * 0.295); }
  .room-advisor .advisor-portrait.figure { pointer-events: auto; cursor: pointer; }
  /* Choosing a politician: the one picked full-body above the faces. */
  .politician-chooser { display: grid; gap: 4px; }
  .chooser-hero { display: flex; justify-content: center; height: 250px; padding-top: 4px; background: radial-gradient(60% 55% at 50% 60%, #efe6d4 0%, transparent 72%); }
  .chooser-hero .full-body { height: 100%; width: auto; }
  /* A politician's profile: full-body beside their ranks. */
  .profile-top { display: grid; grid-template-columns: 44% 1fr; gap: 10px; align-items: end; margin: 2px 0 8px; }
  .profile-figure { display: flex; justify-content: center; align-items: flex-end; height: 260px; overflow: hidden; border-radius: 12px; background: radial-gradient(80% 60% at 50% 70%, #efe6d4 0%, #e3d8c3 100%); }
  .profile-figure { border: 0; padding: 0; width: 100%; font: inherit; color: inherit; cursor: zoom-in; }
  .profile-figure .full-body { height: 100%; width: auto; max-width: 100%; flex: none; }
  .profile-figure .advisor-picture { height: 100%; width: auto; max-width: 100%; object-fit: contain; object-position: bottom; }
  .serves { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; margin-top: 2px; }
  /* A full-body picture full screen (5 Oct 2026): a tap anywhere closes it. */
  .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(15, 29, 40, 0.94); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 16px; cursor: zoom-out; }
  .lightbox .lightbox-figure { flex: none; max-width: none; }
  .lightbox-card { padding: 12px; border-radius: 14px; background: radial-gradient(80% 60% at 50% 70%, #efe6d4 0%, #e3d8c3 100%); line-height: 0; }
  .lightbox img.lightbox-figure { max-width: calc(100vw - 56px); max-height: calc(100vh - 134px); width: auto; height: auto; }
  .lightbox-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: rgba(255, 255, 255, 0.14); color: #fff; border-color: transparent; }
  /* A release since the page was loaded (5 Oct 2026): offer to reload. */
  .update-banner { position: sticky; top: 0; z-index: 90; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--ink); color: var(--page); font-size: 14px; }

ercentiles below.",termWeights:[32.3,24.5,19.6,14.4,9.2],percentiles:[10,25,50,75,90],scores:{"1":{fame:[0,8,36.8,98,180.2],competence:[5,13,26,43,66],character:[11.5,37,56,71,77],standing:[12,52,79,95,129.5],mental:[61,88,100,100,100]},"2":{fame:[0,18.1,73,206.4,408.7],competence:[10,26,54,93.5,149],character:[42,85,121,144,157],standing:[33,102,150,185,242],mental:[67,90,100,100,100]},"3":{fame:[.4,26.4,103.1,291,603.6],competence:[13,39,83,144,220],character:[80,138,185,215,242],standing:[74,158,221,284,342],mental:[75,92,100,100,100]},"4":{fame:[1.5,32.4,132.2,369.8,774.4],competence:[18,51,107,188,284],character:[123,189,245,284,364],standing:[109,211.5,294,369,444],mental:[75,91,100,100,100]}},_startWeights:"The owner's choice of 12 Oct 2026 (after scripts/experience-check.ts, 'last'): how many terms the computer MPs of a new game have behind them. A third start new; half start in their last term (4 behind them), so they retire at the first election and open up roles and seats for term 2; the rest have 1 to 3 terms, in the measured proportions. termWeights above stays the measured spread.",startWeights:[33,7.1,5.7,4.2,50],_band:"The owner's choice of 12 Oct 2026: each score is drawn from the lower half of what computer MPs with that many terms reach (10th to 50th percentile).",band:[10,50],_share:"The owner's choice of 12 Oct 2026: computer MPs start half the way from the starting scores to the drawn ones, a smaller head start.",share:.5};var ie=(e,t=-5,s=5)=>Math.min(s,Math.max(t,e));function _e(e,t){return Math.abs(e[t.axis]-t.position)}function Re(e,t,s="euclidean",a=1,r=1){let o=Math.abs(e.lr-t.lr),i=Math.abs(e.pc-t.pc);return s==="manhattan"?a*o+r*i:Math.sqrt(a*o*o+r*i*i)}function Ee(e,t,s){return _e(e,t)<=s}var tn={_about:"All tuning numbers for Politics - Altar of Democracy. Change a number here to rebalance the game; no code changes needed. MV = the motion's weight (1-5).",supportThreshold:2,_supportThreshold:"A position supports a motion when it is within this distance of the motion on the motion's axis. The 2014 prototype used 1.1; agreed to loosen to about 2 and tune by simulation.",distanceMetric:"euclidean",_distanceMetric:"How players and voters measure distance to a party. 'euclidean' = straight line (decided 27 Sep 2026). 'manhattan' = sum of the two gaps, as in 2014; with parties on one diagonal it leaves right-progressive and left-conservative positions exactly equidistant from all three parties.",loyalty:{keepMultiplier:1,breakLine:-3,breakIdeology:-2,breakValues:-2,breakValuesFar:-4,farDistance:5},_loyalty:"Multiples of MV. Keeping a loyalty earns +1 x MV. Breaking the party line costs -3 x MV (in-party standing), the party's ideology -2 x MV (character), your own values -2 x MV (mental health), or -4 x MV when the motion is more than farDistance from your position.",abstainFactor:.5,_abstainFactor:"Abstaining counts as 'against' for the comparisons and multiplies every score effect, including news, by this factor: a pointed abstention is a milder form of rebellion that can still be taken to the press.",missedVoteStanding:-1,competence:{lineWon:1,lineLost:-1},_competence:"Multiples of MV, only when you voted with the party line: + if the line won the plenary vote, - if it lost. 0 if you broke the line.",news:{lineVsIdeology:1,voteVsLine:2,voteVsIdeology:1,voteVsValues:1,voteVsCoalition:1},_news:"News points per conflict. Newsworthiness = total news points x MV. voteVsCoalition (new games from 11 Oct 2026, the owner's choice of the three news rules of 4 Oct): a coalition MP voting against the cabinet's position in parliament is one news point, like voting against the ideology. The other two (extremeMotion, exposure.quietByWeight) stay off.",exposure:{pressMultiplier:2,quiet:-1,emptyPress:-2},_exposure:"Newsworthy vote: exposure = newsworthiness, x pressMultiplier with the press. Not newsworthy: quiet (no press) or emptyPress (went to the press with nothing to say).",fameAppearanceBonusPercent:1,missedVoteFameBonus:!0,_missedVoteFameBonus:"A missed vote's fame loss grows with successful press appearances, as a quiet vote's does (decided 29 Sep 2026, engineering review question 9; the design document's formula). Games created before: a flat loss.",_fame:"Fame gained = exposure x (1 + successful press appearances x this percentage / 100).",pressPerSession:2,mentalHealth:{max:100,collapseAt:0,collapseEndsCareer:!0},_mentalHealth:"Mental health is a percentage: 100% at most, never below 0%. Reaching 0% is an emotional collapse; with collapseEndsCareer the politician leaves parliament at once and casts no further votes.",startingScores:{fame:0,competence:0,character:0,standing:20,mental:80},game:{players:20,sessions:6,motionsPerSession:5,seats:20,partyCapShare:.4,playerSpread:2},parties:[{name:"Party 1",ideology:{lr:2,pc:2}},{name:"Party 2",ideology:{lr:0,pc:0}},{name:"Party 3",ideology:{lr:-2,pc:-2}}],drift:{strength:1,jitterRange:.5,jitterSize:1},_drift:"When a party's MPs pass a motion by majority 'for', its image moves towards the motion by the motion's share of the session's weight x strength. Voting against a motion within jitterRange of the image makes the image jump by +/- jitterSize.",electorate:{voters:1e4,spread:2,pollSample:500,pollNoise:.03,pollAfterSessions:[2,4],types:[{name:"Balanced",share:.2,weightLR:1,weightPC:1,breachPenalty:0,loyaltyBonus:0},{name:"Economic",share:.2,weightLR:1,weightPC:.3,breachPenalty:0,loyaltyBonus:0},{name:"Cultural",share:.2,weightLR:.3,weightPC:1,breachPenalty:0,loyaltyBonus:0},{name:"Floating",share:.2,weightLR:1,weightPC:1,breachPenalty:4,loyaltyBonus:0},{name:"Loyal",share:.2,weightLR:1,weightPC:1,breachPenalty:0,loyaltyBonus:1}]},_electorate:"10,000 voters and polls of 500 (raised from 500 and 150 on 27 Sep 2026). Simulated voters pick the party with the smallest weighted distance to its current image. Floating voters add breachPenalty x (share of motions where the party voted against its own ideology). Loyal voters get a ayers who said they are willing are drawn at random, then computer MPs. When a role holder collapses, everyone below moves up. Each role doubles the score change of its own specialty on every vote, gains and losses alike: the leader's fame, the deputy's competence, the whip's in-party standing (the simulation showed this keeps leadership contested; doubling everything entrenched leaders).",coalition:{cabinetShare:.1,agreementRange:2,ministerMultiplier:3,strain:{perLevel:17,heavyWeight:null,crisisLevel:4,breakingLevel:5,major:2,minor:1},botLeave:{crisis:.25,breaking:.5},fallBonus:.45,fallBlame:!0,verdict:{goodMark:750,badAtZero:["mental","standing","competence"],fallCompetence:150,boringMental:25,topJobLegacy:.25,badLegacy:.05,topJobPerTerm:.2,opportunists:["optimiser","maverick"],principled:["ideologue","conscience","rebel"]},crisisInLastSession:!1,crisisOddsFromAgenda:!0,tiedCabinetFollowsAgreement:!0,onePartyCrisis:!1,largestByVotes:!0,replaceCollapsed:!0},_coalition:"Coalitions and the cabinet (coalition layer stage 2, decided 27 Sep 2026). After each election the largest party forms a coalition with the nearest parties until they hold a majority; its top-ranked member is prime minister; 10% of the seats are ministers, shared by seats, from the top of each coalition party's ranking (computer MPs in the first period), who leave parliament for a stand-in and hand on any party role. The coalition agreement is a range of 2 points on each axis around the partners' ideologies averaged by seats. Each session starts in the cabinet room: ministers vote on every motion (every score change x3; competence comes from their party's votes in parliament); the cabinet's majority is the coalition parties' starting line. Strain (the simpler model, decided 29 Sep 2026, afternoon): 2 points when a coalition party defects in parliament, 1 when a minister defects in the cabinet, 17 points a level (five named levels), a session without breaches eases a level. 17 points a level in games
