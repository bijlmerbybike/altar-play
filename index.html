<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altar of Democracy · online</title>
<meta name="description" content="Politics – Altar of Democracy: a parliament game to play with friends over several days.">
<meta name="theme-color" content="#b3121f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #f6f2ef;
    --surface: #ffffff;
    --surface-2: #faf7f5;
    --ink: #1d1718;
    --ink-2: #574d4e;
    --muted: #877c7d;
    --hairline: #e6dfdc;
    --axis: #c9c0be;
    --accent: #b3121f;
    --accent-ink: #ffffff;
    --accent-soft: #f7e3e4;
    --yes: #0b7a3e;
    --yes-soft: #e3f3ea;
    --no: #b3121f;
    --no-soft: #f8e5e6;
    --warn: #9a5b00;
    --warn-soft: #fbefd9;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #9b1d3c; --s8: #6b5443;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #141011; --surface: #1f1a1b; --surface-2: #26201f; --ink: #f6f1f0; --ink-2: #c7bcbb; --muted: #938889;
      --hairline: #352d2e; --axis: #4d4344; --accent: #e5535d; --accent-ink: #1a0d0e; --accent-soft: #3a1c1f;
      --yes: #4cc07e; --yes-soft: #17301f; --no: #f07a80; --no-soft: #3a1c1f; --warn: #e3a33a; --warn-soft: #362812;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9e2f; --s7: #d0506f; --s8: #a98a6e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #141011; --surface: #1f1a1b; --surface-2: #26201f; --ink: #f6f1f0; --ink-2: #c7bcbb; --muted: #938889;
    --hairline: #352d2e; --axis: #4d4344; --accent: #e5535d; --accent-ink: #1a0d0e; --accent-soft: #3a1c1f;
    --yes: #4cc07e; --yes-soft: #17301f; --no: #f07a80; --no-soft: #3a1c1f; --warn: #e3a33a; --warn-soft: #362812;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9e2f; --s7: #d0506f; --s8: #a98a6e;
  }

  body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  #app { min-height: 100%; }
  .page { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 16px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 9vw, 60px); letter-spacing: -0.015em; color: var(--accent); }
  h2 { font-family: var(--display); font-weight: 700; font-size: 26px; }
  h3 { font-size: 17px; font-weight: 600; }
  p { margin: 0; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .lead { font-size: 18px; color: var(--ink-2); }
  .muted, .hint { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }

  button { font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.link { background: none; border: none; padding: 4px 0; color: var(--ink-2); text-decoration: underline; justify-self: start; font-weight: 500; }
  :focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
  input[type="text"] { font: inherit; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-2); color: var(--ink); width: 100%; box-sizing: border-box; }
  .field-label { font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  /* Intro */
  .intro { padding-top: 48px; }
  .intro .resume { border-color: var(--accent); }
  details.how { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px 16px; }
  details.how summary { cursor: pointer; font-weight: 600; }
  details.how ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); }

  /* Questionnaire */
  .progress { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); }
  .statement { font-size: clamp(24px, 5.5vw, 32px); padding-block: 24px 8px; }
  .answers { display: grid; gap: 8px; }
  .answer { text-align: left; }
  .answer.picked { border-color: var(--accent); background: var(--accent-soft); }

  /* Party choice */
  .compass { margin: 0; max-width: 360px; justify-self: center; width: 100%; }
  .compass svg { width: 100%; height: auto; display: block; }
  .axis-t { font-size: 11px; fill: var(--muted); font-family: var(--sans); }
  .pmark circle { stroke: var(--surface); stroke-width: 2; }
  .pmark.hl circle { stroke: var(--ink); stroke-width: 2.5; }
  .pmark-t { font-size: 8px; font-weight: 700; fill: #fff; font-family: var(--sans); }
  .you { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .you-t { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--sans); }
  .party-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .party-option { grid-template-columns: 1fr auto; align-items: center; }
  .party-option.best { border-color: var(--accent); }
  .party-option button { grid-column: 1 / -1; justify-self: start; }
  .party-name { display: flex; gap: 10px; align-items: center; }
  .party-name small { display: block; color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
  .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Party colours */
  .p1 { --pc: var(--s1); } .p2 { --pc: var(--s2); } .p3 { --pc: var(--s3); } .p4 { --pc: var(--s4); } .p5 { --pc: var(--s5); } .p6 { --pc: var(--s6); } .p7 { --pc: var(--s7); } .p8 { --pc: var(--s8); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; }
  .dot.big { width: 18px; height: 18px; }
  .pmark circle, .seat { fill: var(--pc); }
  .party-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; min-width: 58px; }

  /* Top bar */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--hairline); padding: 8px 16px 10px; display: grid; gap: 6px; }
  .topline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; max-width: 680px; width: 100%; margin: 0 auto; }
  .topline .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .topline .where { color: var(--muted); }
  .scorebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 680px; width: 100%; margin: 0 auto; }
  .score { display: grid; gap: 1px; min-width: 0; }
  .score .label { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score .value { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }
  .meter { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--yes); }

  /* Motions */
  .motion h3 { font-family: var(--display); font-weight: 700; font-size: 21px; }
  .motion-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .motion-no { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .axis { border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 8px; }
  .weight { display: inline-flex; gap: 3px; margin-left: auto; }
  .weight i { width: 8px; height: 8px; border-radius: 50%; background: var(--hairline); }
  .weight i.on { background: var(--accent); }
  .advisors { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .advisor { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
  .advisor b { color: var(--ink); font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--hairline); color: var(--ink-2); }
  .advisor.yes { background: var(--yes-soft); } .advisor.yes .avatar { background: var(--yes); color: #fff; }
  .advisor.no { background: var(--no-soft); } .advisor.no .avatar { background: var(--no); color: #fff; }
  .advisor.warn { background: var(--warn-soft); } .advisor.warn .avatar { background: var(--warn); color: #fff; }
  .ask { font-weight: 600; font-size: 14px; margin-top: 4px; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg { padding: 12px 8px; }
  .seg.picked.for { background: var(--yes); border-color: var(--yes); color: #fff; }
  .seg.picked.against { background: var(--no); border-color: var(--no); color: #fff; }
  .seg.picked.abstain { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
  .press { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; padding: 8px 10px; border: 1px dashed var(--axis); border-radius: 8px; cursor: pointer; }
  .press.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .press input { width: 18px; height: 18px; accent-color: var(--accent); }
  .press-left { font-weight: 600; color: var(--accent); }

  .line-result { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .line-chip { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
  .line-chip.yes { background: var(--yes); color: #fff; }
  .line-chip.no { background: var(--no); color: #fff; }
  .tally { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .other-lines { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; }
  .mini { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }

  /* Results */
  .deltas { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .delta { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; }
  .delta .label { font-size: 12px; color: var(--muted); }
  .delta .value { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .delta.up .value { color: var(--yes); }
  .delta.down .value { color: var(--no); }
  .you-voted { font-size: 14px; color: var(--ink-2); }
  .explain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .explain li { padding-left: 12px; border-left: 3px solid var(--hairline); color: var(--ink-2); }
  .explain li.up { border-left-color: var(--yes); }
  .explain li.down { border-left-color: var(--no); }
  .alarm { border-color: var(--no); background: var(--no-soft); }
  .fate.kept { border-color: var(--yes); }
  .fate.seat, .fate.collapse, .fate.ballot { border-color: var(--no); }
  .off-ballot { color: var(--no); font-weight: 600; }
  .fate.retired { border-color: var(--accent); }
  /* the art layer: pictures by name, placeholders drawn in code until the artwork exists */
  .art { margin: 0; display: block; }
  .art img { display: block; width: 100%; border-radius: 12px; }
  .art.banner { margin: 2px 0 12px; }
  .art.banner svg { display: block; width: 100%; height: 84px; }
  .art.banner img { height: clamp(110px, 19vh, 200px); object-fit: cover; object-position: 50% 50%; }
  .art-placeholder { color: var(--ink-2); }
  .art-placeholder .ln { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
  .art-placeholder .ln.thick { stroke-width: 3.5; }
  .art-placeholder .soft { fill: var(--surface-2); stroke: none; }
  .art-placeholder .paper { fill: var(--surface); stroke: none; }
  .art-placeholder .accent { fill: var(--accent); opacity: 0.8; stroke: none; }
  .art-placeholder .accent-ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .art-placeholder .frame { fill: none; stroke: currentColor; stroke-width: 3; opacity: 0.8; }
  .art-placeholder .bar { fill: currentColor; opacity: 0.45; }
  .art-placeholder .confetti { fill: var(--accent); opacity: 0.7; }
  .cutscene .cs-art { margin: 0 auto 4px; width: 100%; max-width: 420px; color: var(--cs-muted); }
  .cutscene .cs-art svg { display: block; width: 100%; height: 96px; }
  .cutscene .cs-art .soft { fill: var(--cs-card); }
  .cutscene .cs-art .paper { fill: #2d2526; }
  .cs-art-ballot { margin: 0 auto; }
  /* Real pictures in the cut scenes and the press room (batch 2, 4 Oct 2026); the drawn placeholders keep the rules above. */
  .cutscene .cs-art img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); }
  .cs-intro .art.cs-art-ballot:not(.art-placeholder) { width: min(240px, 62vw); }
  .cs-intro .art.cs-art-ballot img { border-radius: 16px; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5); animation: cs-in 0.6s ease-out both; }
  .press-hero .art:not(.art-placeholder) { width: calc(100% + 24px); margin: -14px -12px 6px; }
  .press-hero .art img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px 12px 0 0; }
  /* a name that opens a profile */
  .name-link { all: unset; cursor: pointer; font: inherit; color: inherit; text-decoration: underline dotted var(--ink-2); text-underline-offset: 3px; }
  .name-link:hover, .name-link:focus-visible { text-decoration-style: solid; color: var(--accent); }
  .name-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sheet-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; padding: 16px 16px 28px; box-shadow: 0 -8px 30px rgba(0,0,0,0.25); display: grid; gap: 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet-head h3 { margin: 0; font-size: 20px; }
  .sheet-close { width: 36px; height: 36px; border-radius: 50%; padding: 0; font-size: 22px; line-height: 1; }
  .profile-ranks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .profile-ranks > div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .profile-ranks small { display: block; font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .profile-ranks b { font-size: 22px; }
  .profile-ranks span { color: var(--ink-2); font-size: 13px; }
  .profile-scores { width: 100%; border-collapse: collapse; font-size: 14px; }
  .profile-scores th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 0; }
  .profile-scores td { padding: 6px 0; border-top: 1px solid var(--hairline); }
  .profile-scores td:nth-child(2) { font-weight: 700; font-variant-numeric: tabular-nums; }
  /* the dynasty */
  .dynasty { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .dynasty-card { display: grid; gap: 6px; }
  .dynasty-card.in-office { border-color: var(--accent); }
  .dyn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dyn-name { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .dyn-badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .dyn-badge.retired { background: var(--yes-soft); color: var(--yes); }
  .dyn-badge.fell { background: var(--no-soft); color: var(--no); }
  .dyn-badge.in-office { background: var(--accent-soft); color: var(--accent); }
  .retake .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  .retiring { color: var(--ink-2); font-weight: 600; }
  .personal-votes { color: var(--warn); font-weight: 600; }
  /* coalitions: the cabinet room, the strain meter, the crisis vote, the verdict on ministers */
  .roomnav.five { grid-template-columns: repeat(5, 1fr); }
  .roomnav.five .roomlabel { font-size: 11px; }
  .role-badge.minister { color: var(--accent-ink); background: var(--accent); }
  .strain { display: grid; gap: 6px; margin: 4px 0 12px; }
  .strain-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .strain-seg { height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--hairline); }
  .strain-seg.on.l1 { background: #6fae7a; border-color: #6fae7a; }
  .strain-seg.on.l2 { background: #b8b34a; border-color: #b8b34a; }
  .strain-seg.on.l3 { background: #d9922e; border-color: #d9922e; }
  .strain-seg.on.l4 { background: #d8622f; border-color: #d8622f; }
  .strain-seg.on.l5 { background: #c0302c; border-color: #c0302c; }
  .strain-seg.here { outline: 2px solid var(--ink); outline-offset: 1px; }
  .strain.fell .strain-seg { background: var(--no-soft, #f3d6d6); border-color: var(--no, #b3121f); }
  .strain-label { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .strain-label small { font-family: inherit; font-weight: 500; font-size: 13px; color: var(--ink-2); }
  .coalition-parties { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
  .card.crisis { border-color: var(--accent); background: var(--accent-soft); }
  .card.crisis .row, .verdict .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.primary.danger { background: #c0302c; border-color: #c0302c; }
  .verdict.good { border-color: #6fae7a; }
  .verdict.bad { border-color: #c0302c; }
  .verdict h3 { font-family: var(--display); font-size: 20px; }
  .verdict .offer button { flex: 1 1 140px; padding: 14px; font-size: 16px; }
  /* party roles: tags, the roles card, volunteering */
  .role-tag { color: var(--accent); font-weight: 600; }
  .role-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  .roles.holder { border-color: var(--accent); }
  .role-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
  .role-list li { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; align-items: baseline; }
  .role-list .role-name { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .volunteer { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; cursor: pointer; }
  .volunteer input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
  .volunteer span { display: grid; gap: 4px; }
  .volunteer small { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
  /* careers: the new politician's party, standing down */
  .party-choice { display: grid; gap: 8px; margin-top: 4px; }
  .join-option { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: center; text-align: left; padding: 10px 12px; }
  .join-option .jo-name { font-weight: 600; }
  .join-option .jo-note { grid-column: 2; color: var(--ink-2); font-size: 13px; }
  .join-option.here { border-color: var(--accent); background: var(--accent-soft); }
  .career .career-note { font-size: 14px; }
  .career .confirm { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }

  /* ---- online game ---- */
  html, body { margin: 0; padding: 0; }

  input[type="date"], textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-2); color: var(--ink); width: 100%; box-sizing: border-box; }

  .chat-list li.notice { justify-self: stretch; max-width: none; background: var(--warn-soft); border: 1px solid var(--warn); }

  .links { display: grid; gap: 10px; padding-top: 8px; }

  .member-tag.human { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .member-sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

  .rooms .room-page { gap: 12px; padding-top: 10px; }
  /* ---- rooms as full-screen paintings (4 Oct 2026): the painting behind, a paper sheet with the menus over its
     lower part; on entering, the painting shows on its own first and the menus slide in ---- */
  .rooms.has-backdrop { --stage-h: max(150px, 34vh); --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
  .room-backdrop { position: fixed; inset: 0; z-index: 0; background: #172b3a; overflow: hidden; }
  .room-backdrop .art { position: absolute; inset: 0; margin: 0 auto; max-width: 680px; }
  .room-backdrop .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; border-radius: 0;
    transform: translateY(calc(var(--shift, 0vh) * -1)); transition: transform 0.8s var(--ease); }
  .room-backdrop::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; pointer-events: none;
    background: linear-gradient(transparent, rgba(23, 43, 58, 0.82)); opacity: 0; transition: opacity 0.5s; }
  .room-backdrop.drawn { background: var(--surface-2); }
  .room-backdrop.drawn .art { top: 72px; bottom: auto; height: calc(var(--stage-h) - 72px); padding-inline: 16px; color: var(--ink-2); }
  .room-backdrop.drawn .art svg { width: 100%; height: 100%; }
  .room-backdrop.drawn::after { display: none; }
  .room-backdrop.drawn ~ .room-caption h2 { color: var(--ink); text-shadow: none; }
  .room-backdrop.drawn ~ .room-caption span { color: var(--accent); }
  .rooms.has-backdrop .topbar { background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: transform 0.5s var(--ease), opacity 0.4s; }
  .rooms.has-backdrop .room-page { position: relative; z-index: 1; gap: 0; padding-top: 0; padding-bottom: 0; padding-inline: 0; }
  .room-stage { height: var(--stage-h); }
  .room-sheet { display: grid; gap: 12px; align-content: start; min-width: 0; padding: 16px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
    min-height: calc(100vh - var(--stage-h)); background: var(--page); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(23, 43, 58, 0.28);
    transition: transform 0.7s var(--ease), opacity 0.4s; }
  .sheet-handle { justify-self: stretch; height: 22px; margin: -14px 0 -4px; padding: 0; border: none; border-radius: 18px 18px 0 0; background: none; cursor: grab; position: relative; }
  .sheet-handle::before { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--hairline); }
  .sheet-handle:hover::before { background: var(--muted); }
  .room-sheet.dragging { transition: none; }
  html:has(.rooms.has-backdrop) { overscroll-behavior-y: none; }
  .room-peek { position: fixed; inset: 0; z-index: 25; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    background: transparent; border: none; border-radius: 0; touch-action: none; cursor: pointer; }
  .room-peek-tab { display: grid; justify-items: center; gap: 6px; padding: 8px 18px 10px; border-radius: 14px; background: rgba(23, 43, 58, 0.62); color: #f2ebdd;
    font-size: 13px; font-weight: 600; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: cs-in 0.5s ease-out both; animation-delay: 0.35s; }
  .room-peek-tab i { width: 40px; height: 4px; border-radius: 2px; background: #f2ebdd; opacity: 0.8; }
  .rooms.has-backdrop .roomnav { transition: transform 0.5s var(--ease), opacity 0.4s; }
  .room-caption { position: fixed; left: 0; right: 0; bottom: max(14vh, 90px); z-index: 2; display: grid; justify-items: center; gap: 4px; padding-inline: 24px;
    color: #f2ebdd; text-align: center; pointer-events: none; opacity: 0; transform: translateY(12px); transition: opacity 0.4s, transform 0.6s var(--ease); }
  .room-caption h2 { font-family: var(--display); font-size: clamp(34px, 10vw, 52px); line-height: 1; color: #f2ebdd; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }
  .room-caption span { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e2c78f; }
  .room-reveal-skip { position: fixed; inset: 0; z-index: 25; background: transparent; border: none; border-radius: 0; padding: 0; cursor: pointer; }
  .rooms.revealing .room-backdrop .art img, .rooms.lowered .room-backdrop .art img { transform: none; }
  .rooms.revealing .room-backdrop::after, .rooms.lowered .room-backdrop::after { opacity: 1; }
  .rooms.revealing .room-caption, .rooms.lowered .room-caption { opacity: 1; transform: none; }
  .rooms.revealing .topbar, .rooms.lowered .topbar { transform: translateY(-110%); opacity: 0; }
  .rooms.revealing .roomnav, .rooms.lowered .roomnav { transform: translateY(110%); opacity: 0; }
  .rooms.revealing .room-sheet, .rooms.lowered .room-sheet { transform: translateY(100vh); opacity: 0; }
  @media (max-height: 700px) { .rooms.has-backdrop { --stage-h: max(120px, 24vh); } }
  @media (prefers-reduced-motion: reduce) {
    .room-backdrop .art img, .room-sheet, .room-caption, .rooms.has-backdrop .topbar, .rooms.has-backdrop .roomnav { transition: none; }
  }

  .passed .cs-stamp { color: var(--cs-up); }
  .rejected .cs-stamp { color: var(--cs-down); }
  @keyframes cs-stamp { from { transform: rotate(-4deg) scale(2.2); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
  .cs-motion-text { font-size: 14px; line-height: 1.35; color: var(--cs-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cs-tally { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--cs-line); }
  .cs-tally i { display: block; height: 100%; }
  .cs-tally .for { background: var(--cs-up); }
  .cs-tally .against { background: var(--cs-down); }
  .cs-tally .abstain { background: var(--cs-muted); }
  .cs-tally-nums { display: flex; gap: 12px; font-size: 12px; color: var(--cs-muted); font-variant-numeric: tabular-nums; }
  .cs-tally-nums .for { color: var(--cs-up); }
  .cs-tally-nums .against { color: var(--cs-down); }
  .cs-you { font-size: 13px; color: var(--cs-muted); border-top: 1px solid var(--cs-line); padding-top: 7px; }
  .cs-you.won { color: var(--cs-ink); }
  .cs-poll-row.cs-poll-head { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cs-muted); }
  .cs-poll-head span:nth-child(n+3) { text-align: right; }
  .cs-poll-row .cs-delta { min-width: 0; font-size: 12px; }
  .cs-seats { display: flex; justify-content: flex-end; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
  .cs-seat-num { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .cs-seats small { font-size: 11px; font-weight: 700; color: var(--cs-muted); min-width: 22px; }
  .cs-seats.up small { color: var(--cs-up); }
  .cs-seats.down small { color: var(--cs-down); }
  .cs-hemi { display: grid; gap: 4px; justify-items: center; }
  .cs-hemi svg { width: 100%; max-width: 320px; height: auto; }
  .cs-hemi .seat { stroke: var(--cs-bg); }
  .cs-hemi p { font-size: 12px; color: var(--cs-muted); }
  .cs-actions button { width: 100%; padding: 15px; font-size: 16px; }
  .cutscene .cs-actions .primary { background: #e5535d; border-color: #e5535d; color: #1a0d0e; }
  @media (prefers-reduced-motion: reduce) { .cs-scene, .cs-motion, .cs-stamp, .cs-ballot .drop { animation: none; opacity: 1; } .cs-track .fill, .cs-meter .fill { transition: none; } }

ch year.",axis:"pc",position:4,weight:5},{id:31,text:"Let refugees work from their first day in the country.",axis:"pc",position:-3,weight:3},{id:32,text:"Build new nuclear power plants.",axis:"pc",position:2,weight:3},{id:33,text:"Ban new petrol and diesel cars from 2030.",axis:"pc",position:-3,weight:4},{id:34,text:"Replace the monarchy with an elected head of state.",axis:"pc",position:-4,weight:2},{id:35,text:"Increase prison sentences for violent crime.",axis:"pc",position:3,weight:3},{id:36,text:"Reintroduce the death penalty for murder.",axis:"pc",position:5,weight:3},{id:37,text:"Require 40% women on the boards of large companies.",axis:"pc",position:-2,weight:1},{id:38,text:"Ban face-covering clothing in public buildings.",axis:"pc",position:3,weight:2},{id:39,text:"Give the police wider stop-and-search powers.",axis:"pc",position:3,weight:2},{id:40,text:"Make everyone an organ donor unless they opt out.",axis:"pc",position:-2,weight:1},{id:41,text:"Tax meat to fund animal welfare.",axis:"pc",position:-3,weight:2},{id:42,text:"Reintroduce passport checks at the borders with neighbouring countries.",axis:"pc",position:3,weight:3},{id:43,text:"Let citizens elect their mayor directly.",axis:"pc",position:-1,weight:1},{id:44,text:"Protect farmland from being turned into nature reserves.",axis:"pc",position:2,weight:2},{id:45,text:"Ban social media for children under 15.",axis:"pc",position:1,weight:2},{id:46,text:"Make singing the national anthem compulsory in schools.",axis:"pc",position:3,weight:1},{id:47,text:"Add a gender-neutral option to passports.",axis:"pc",position:-3,weight:1},{id:48,text:"Decriminalise possessing any drug for personal use.",axis:"pc",position:-5,weight:2}]};var ee=(t,e=-5,n=5)=>Math.min(n,Math.max(e,t));function Se(t,e){return Math.abs(t[e.axis]-e.position)}function be(t,e,n="euclidean",s=1,a=1){let r=Math.abs(t.lr-e.lr),i=Math.abs(t.pc-e.pc);return n==="manhattan"?s*r+a*i:Math.sqrt(s*r*r+a*i*i)}function Me(t,e,n){return Se(t,e)<=n}var Un={_about:"All tuning numbers for Politics - Altar of Democracy. Change a number here to rebalance the game; no code changes needed. MV = the motion's weight (1-5).",supportThreshold:2,_supportThreshold:"A position supports a motion when it is within this distance of the motion on the motion's axis. The 2014 prototype used 1.1; agreed to loosen to about 2 and tune by simulation.",distanceMetric:"euclidean",_distanceMetric:"How players and voters measure distance to a party. 'euclidean' = straight line (decided 27 Sep 2026). 'manhattan' = sum of the two gaps, as in 2014; with parties on one diagonal it leaves right-progressive and left-conservative positions exactly equidistant from all three parties.",loyalty:{keepMultiplier:1,breakLine:-3,breakIdeology:-2,breakValues:-2,breakValuesFar:-4,farDistance:5},_loyalty:"Multiples of MV. Keeping a loyalty earns +1 x MV. Breaking the party line costs -3 x MV (in-party standing), the party's ideology -2 x MV (character), your own values -2 x MV (mental health), or -4 x MV when the motion is more than farDistance from your position.",abstainFactor:.5,_abstainFactor:"Abstaining counts as 'against' for the comparisons and multiplies every score effect, including news, by this factor: a pointed abstention is a milder form of rebellion that can still be taken to the press.",missedVoteStanding:-1,competence:{lineWon:1,lineLost:-1},_competence:"Multiples of MV, only when you voted with the party line: + if the line won the plenary vote, - if it lost. 0 if you broke the line.",news:{lineVsIdeology:1,voteVsLine:2,voteVsIdeology:1,voteVsValues:1},_news:"News points per conflict. Newsworthiness = total news points x MV.",exposure:{pressMultiplier:2,quiet:-1,emptyPress:-2},_exposure:"Newsworthy vote: exposure = newsworthiness, x pressMultiplier with the press. Not newsworthy: quiet (no press) or emptyPress (went to the press with nothing to say).",fameAppearanceBonusPercent:1,missedVoteFameBonus:!0,_missedVoteFameBonus:"A missed vote's fame loss grows with successful press appearances, as a quiet vote's does (decided 29 Sep 2026, engineering review question 9; the design document's formula). Games created before: a flat loss.",_fame:"Fame gained = exposure x (1 + successful press appearances x this percentage / 100).",pressPerSession:2,mentalHealth:{max:100,collapseAt:0,collapseEndsCareer:!0},_mentalHealth:"Mental health is a percentage: 100% at most, never below 0%. Reaching 0% is an emotional collapse; with collapseEndsCareer the politician leaves parliament at once and casts no further votes.",startingScores:{fame:0,competence:0,character:0,standing:20,mental:80},game:{players:20,sessions:6,motionsPerSession:5,seats:20,partyCapShare:.4,playerSpread:2},parties:[{name:"Party 1",ideology:{lr:2,pc:2}},{name:"Party 2",ideology:{lr:0,pc:0}},{name:"Party 3",ideology:{lr:-2,pc:-2}}],drift:{strength:1,jitterRange:.5,jitterSize:1},_drift:"When a party's MPs pass a motion by majority 'for', its image moves towards the motion by the motion's share of the session's weight x strength. Voting against a motion within jitterRange of the image makes the image jump by +/- jitterSize.",electorate:{voters:1e4,spread:2,pollSample:500,pollNoise:.03,pollAfterSessions:[2,4],types:[{name:"Balanced",share:.2,weightLR:1,weightPC:1,breachPenalty:0,loyaltyBonus:0},{name:"Economic",share:.2,weightLR:1,weightPC:.3,breachPenalty:0,loyaltyBonus:0},{name:"Cultural",share:.2,weightLR:.3,weightPC:1,breachPenalty:0,loyaltyBonus:0},{name:"Floating",share:.2,weightLR:1,weightPC:1,breachPenalty:4,loyaltyBonus:0},{name:"Loyal",share:.2,weightLR:1,weightPC:1,breachPenalty:0,loyaltyBonus:1}]},_electorate:"10,000 voters and polls of 500 (raised from 500 and 150 on 27 Sep 2026). Simulated voters pick the party with the smallest weighted distance to its current image. Floating voters add breachPenalty x (share of motions where the party voted against its own ideology). Loyal voters get a bonus for the party they chose last time. Voter types are a proposal: agreed in principle, weights still to tune.",partyMajority:"cast",_partyMajority:"How a party's majority in parliament is counted. 'cast': only the votes its MPs actually cast, as in the 2014 workbook and in real parliaments; if none of them voted, the party has no majority on that motion (no score, breach or image change). 'seated': a missed vote counts as 'not for' (games created before 27 Sep 2026).",scoreFloor:0,_scoreFloor:"Fame, competence, character and in-party standing never go below this (decided 27 Sep 2026). Mental health keeps its own 0-100% range.",deselectAtFloor:["standing"],_deselectAtFloor:"An MP whose in-party standing is at the floor at the election is left off the party's ballot and loses their seat (decided 27 Sep 2026).",preferenceVotes:{listLeader:.6,fame:.25,character:.15,threshold:.05},_preferenceVotes:"Preference votes at the election (decided 27 Sep 2026). The party bureau lists its members by overall score (members at zero standing are not on the list). 60% of the party's voters vote for the list leader, 25% for a candidate in proportion to fame, 15% in proportion to character. A candidate with personal votes of at least 5% of the party's votes moves to the top of the list, in order of personal votes (the Swedish rule); the others keep their place. The party's seats go down that order.",leaderboardFame:5,_leaderboardFame:"Fame for being named in a top three of the leaderboards cut scene (after sessions 1, 3 and 5), once however many lists you are on (decided 27 Sep 2026). 5 is what one quiet session costs: five votes without news, -1 fame each.",roles:{whipSeats:4,deputySeats:8,multiplier:2},_roles:"Party roles (coalition layer stage 1, decided 27 Sep 2026). Every party has a leader; with 4 or more seats also a whip, with 8 or more a deputy leader. At the start of each period they go down the party's ranking in the party bureau (overall score); in the first period, players who said they are willing are drawn at random, then computer MPs. When a role holder collapses, everyone below moves up. Each role doubles the score change of its own specialty on every vote, gains and losses alike: the leader's fame, the deputy's competence, the whip's in-party standing (the simulation showed this keeps leadership contested; doubling everything entrenched leaders).",coalition:{cabinetShare:.1,agreementRange:2,ministerMultiplier:3,strain:{perLevel:15,heavyWeight:null,crisisLevel:4,breakingLevel:5,major:2,minor:1},botLeave:{crisis:.25,breaking:.5},fallBonus:.45,fallBlame:!0,verdict:{goodMark:750,badAtZero:["mental","standing","competence"],fallCompetence:150,boringMental:25,topJobLegacy:.25,badLegacy:.05,topJobPerTerm:.2,opportunists:["optimiser","maverick"],principled:["ideologue","conscience","rebel"]},crisisInLastSession:!1,crisisOddsFromAgenda:!0,tiedCabinetFollowsAgreement:!0,onePartyCrisis:!1,largestByVotes:!0},_coalition:"Coalitions and the cabinet (coalition layer stage 2, decided 27 Sep 2026). After each election the largest party forms a coalition with the nearest parties until they hold a majority; its top-ranked member is prime minister; 10% of the seats are ministers, shared by seats, from the top of each coalition party's ranking (computer MPs in the first period), who leave parliament for a stand-in and hand on any party role. The coalition agreement is a range of 2 points on each axis around the partners' ideologies averaged by seats. Each session starts in the cabinet room: ministers vote on every motion (every score change x3; competence comes from their party's votes in parliament); the cabinet's majority is the coalition parties' starting line. Strain (the simpler model, decided 29 Sep 2026, afternoon): 2 points when a coalition party defects in parliament, 1 when a minister defects in the cabinet, 15 points a level (five named levels), a session without breaches eases a level; a coalition falls in about 29% of periods. Games created before: weighty motions (4-5) counted twice, with 22 points a level (17 in games created on 29 Sep before this change). At Crisis talks the wronged party's room votes on staying, at Breaking point every coalition party's; a majority to leave brings early elections, where voters reward the party that left and blame each coalition party for its own breaches (fallBlame, below). The verdict on ministers at the election (decided 29 Sep 2026, afternoon, after playing as a minister): a minister whose mental health, in-party standing or competence is at zero is bad (the career ends; 5% legacy), whatever the points gained; the others are good with 750 or more points gained during the term, about the top 10% (a top job on offer; 25% legacy), and boring below that (back to parliament, 25 points less mental health). A fall costs every minister 150 competence. Games created before judged on points only: 770 or more good, below 485 bad (750 and 380 in games created on 29 Sep before this change).",_coalitionRules:"Coalition rules decided 29 Sep 2026 (engineering review questions 7 and 10), for new games: crisisInLastSession false = no 'Stay in the coalition?' vote in the last session, so a walk-out then is not a fall; crisisOddsFromAgenda = computer MPs vote on staying with the odds of the strain level at which the vote was put on the agenda (what players saw); tiedCabinetFollowsAgreement = a cabinet with no votes or a tie takes the coalition agreement's position (coalition motions for, others against) instead of 'against'; onePartyCrisis false = a one-party government holds no crisis votes, so there is no walk-out bonus; largestByVotes = when two parties tie for the most seats, the one with more votes forms the coalition. Walk-out reward (question 8, decided 29 Sep): fallBlame = at the early election the party that left gets fallBonus (0.45) times the share of the coalition's breaches that were not its own, and every coalition party, the one that left too, counts its own coalition breaches once more with floating voters
