<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altar of Democracy · online</title>
<meta name="description" content="Politics – Altar of Democracy: a parliament game to play with friends over several days.">
<meta name="theme-color" content="#b3121f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #f6f2ef;
    --surface: #ffffff;
    --surface-2: #faf7f5;
    --ink: #1d1718;
    --ink-2: #574d4e;
    --muted: #877c7d;
    --hairline: #e6dfdc;
    --axis: #c9c0be;
    --accent: #b3121f;
    --accent-ink: #ffffff;
    --accent-soft: #f7e3e4;
    --yes: #0b7a3e;
    --yes-soft: #e3f3ea;
    --no: #b3121f;
    --no-soft: #f8e5e6;
    --warn: #9a5b00;
    --warn-soft: #fbefd9;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #9b1d3c; --s8: #6b5443;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #141011; --surface: #1f1a1b; --surface-2: #26201f; --ink: #f6f1f0; --ink-2: #c7bcbb; --muted: #938889;
      --hairline: #352d2e; --axis: #4d4344; --accent: #e5535d; --accent-ink: #1a0d0e; --accent-soft: #3a1c1f;
      --yes: #4cc07e; --yes-soft: #17301f; --no: #f07a80; --no-soft: #3a1c1f; --warn: #e3a33a; --warn-soft: #362812;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9e2f; --s7: #d0506f; --s8: #a98a6e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #141011; --surface: #1f1a1b; --surface-2: #26201f; --ink: #f6f1f0; --ink-2: #c7bcbb; --muted: #938889;
    --hairline: #352d2e; --axis: #4d4344; --accent: #e5535d; --accent-ink: #1a0d0e; --accent-soft: #3a1c1f;
    --yes: #4cc07e; --yes-soft: #17301f; --no: #f07a80; --no-soft: #3a1c1f; --warn: #e3a33a; --warn-soft: #362812;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9e2f; --s7: #d0506f; --s8: #a98a6e;
  }

  body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  #app { min-height: 100%; }
  .page { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 16px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 9vw, 60px); letter-spacing: -0.015em; color: var(--accent); }
  h2 { font-family: var(--display); font-weight: 700; font-size: 26px; }
  h3 { font-size: 17px; font-weight: 600; }
  p { margin: 0; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .lead { font-size: 18px; color: var(--ink-2); }
  .muted, .hint { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }

  button { font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.link { background: none; border: none; padding: 4px 0; color: var(--ink-2); text-decoration: underline; justify-self: start; font-weight: 500; }
  :focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
  input[type="text"] { font: inherit; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-2); color: var(--ink); width: 100%; box-sizing: border-box; }
  .field-label { font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  /* Intro */
  .intro { padding-top: 48px; }
  .intro .resume { border-color: var(--accent); }
  details.how { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px 16px; }
  details.how summary { cursor: pointer; font-weight: 600; }
  details.how ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); }

  /* Questionnaire */
  .progress { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); }
  .statement { font-size: clamp(24px, 5.5vw, 32px); padding-block: 24px 8px; }
  .answers { display: grid; gap: 8px; }
  .answer { text-align: left; }
  .answer.picked { border-color: var(--accent); background: var(--accent-soft); }

  /* Party choice */
  .compass { margin: 0; max-width: 360px; justify-self: center; width: 100%; }
  .compass svg { width: 100%; height: auto; display: block; }
  .axis-t { font-size: 11px; fill: var(--muted); font-family: var(--sans); }
  .pmark circle { stroke: var(--surface); stroke-width: 2; }
  .pmark.hl circle { stroke: var(--ink); stroke-width: 2.5; }
  .pmark-t { font-size: 8px; font-weight: 700; fill: #fff; font-family: var(--sans); }
  .you { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .you-t { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--sans); }
  .party-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .party-option { grid-template-columns: 1fr auto; align-items: center; }
  .party-option.best { border-color: var(--accent); }
  .party-option button { grid-column: 1 / -1; justify-self: start; }
  .party-name { display: flex; gap: 10px; align-items: center; }
  .party-name small { display: block; color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
  .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Party colours */
  .p1 { --pc: var(--s1); } .p2 { --pc: var(--s2); } .p3 { --pc: var(--s3); } .p4 { --pc: var(--s4); } .p5 { --pc: var(--s5); } .p6 { --pc: var(--s6); } .p7 { --pc: var(--s7); } .p8 { --pc: var(--s8); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; }
  .dot.big { width: 18px; height: 18px; }
  .pmark circle, .seat { fill: var(--pc); }
  .party-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; min-width: 58px; }

  /* Top bar */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--hairline); padding: 8px 16px 10px; display: grid; gap: 6px; }
  .topline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; max-width: 680px; width: 100%; margin: 0 auto; }
  .topline .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .topline .where { color: var(--muted); }
  .scorebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 680px; width: 100%; margin: 0 auto; }
  .score { display: grid; gap: 1px; min-width: 0; }
  .score .label { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score .value { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }
  .meter { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--yes); }

  /* Motions */
  .motion h3 { font-family: var(--display); font-weight: 700; font-size: 21px; }
  .motion-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .motion-no { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .axis { border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 8px; }
  .weight { display: inline-flex; gap: 3px; margin-left: auto; }
  .weight i { width: 8px; height: 8px; border-radius: 50%; background: var(--hairline); }
  .weight i.on { background: var(--accent); }
  .advisors { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .advisor { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
  .advisor b { color: var(--ink); font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--hairline); color: var(--ink-2); }
  .advisor.yes { background: var(--yes-soft); } .advisor.yes .avatar { background: var(--yes); color: #fff; }
  .advisor.no { background: var(--no-soft); } .advisor.no .avatar { background: var(--no); color: #fff; }
  .advisor.warn { background: var(--warn-soft); } .advisor.warn .avatar { background: var(--warn); color: #fff; }
  .ask { font-weight: 600; font-size: 14px; margin-top: 4px; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg { padding: 12px 8px; }
  .seg.picked.for { background: var(--yes); border-color: var(--yes); color: #fff; }
  .seg.picked.against { background: var(--no); border-color: var(--no); color: #fff; }
  .seg.picked.abstain { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
  .press { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; padding: 8px 10px; border: 1px dashed var(--axis); border-radius: 8px; cursor: pointer; }
  .press.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .press input { width: 18px; height: 18px; accent-color: var(--accent); }
  .press-left { font-weight: 600; color: var(--accent); }

  .line-result { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .line-chip { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
  .line-chip.yes { background: var(--yes); color: #fff; }
  .line-chip.no { background: var(--no); color: #fff; }
  .tally { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .other-lines { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; }
  .mini { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }

  /* Results */
  .deltas { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .delta { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; }
  .delta .label { font-size: 12px; color: var(--muted); }
  .delta .value { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .delta.up .value { color: var(--yes); }
  .delta.down .value { color: var(--no); }
  .you-voted { font-size: 14px; color: var(--ink-2); }
  .explain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .explain li { padding-left: 12px; border-left: 3px solid var(--hairline); color: var(--ink-2); }
  .explain li.up { border-left-color: var(--yes); }
  .explain li.down { border-left-color: var(--no); }
  .alarm { border-color: var(--no); background: var(--no-soft); }
  .fate.kept { border-color: var(--yes); }
  .fate.seat, .fate.collapse, .fate.ballot { border-color: var(--no); }
  .off-ballot { color: var(--no); font-weight: 600; }

  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
  .bar-track { height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
  .bar-track i { display: block; height: 100%; background: var(--pc); border-radius: 0 4px 4px 0; }
  .bar-val { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
  .hemicycle { margin: 0; }
  .hemicycle svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
  .seat { stroke: var(--surface); stroke-width: 1.5; }

  .sticky-actions { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--page) 30%); display: flex; flex-wrap: wrap; gap: 10px; }
  .sticky-actions .primary { flex: 1 1 auto; padding: 14px 18px; font-size: 16px; }

  @media (max-width: 420px) {
    .score .label { font-size: 10px; }
    .score .value { font-size: 14px; }
    .motion h3 { font-size: 19px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .seg, .answer, .press { transition: background-color 0.15s, border-color 0.15s; }
  }

  /* ---- online game ---- */
  html, body { margin: 0; padding: 0; }
  * { -webkit-tap-highlight-color: transparent; }
  input[type="date"], textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-2); color: var(--ink); width: 100%; box-sizing: border-box; }
  textarea { resize: vertical; min-height: 48px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row.wrap { flex-wrap: wrap; }
  .row > input, .row > textarea { flex: 1 1 auto; min-width: 0; }
  .center { text-align: center; justify-items: center; }
  .code-input { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }
  .code-box { font-family: var(--display); font-size: 44px; font-weight: 800; letter-spacing: 0.18em; color: var(--accent); }
  .game-list, .people, .chat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .game-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .game-list small { color: var(--muted); }
  .people li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pace-options { display: grid; gap: 8px; }
  .pace { display: grid; gap: 2px; text-align: left; font-weight: 500; padding: 12px 14px; }
  .pace small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .pace.picked { border-color: var(--accent); background: var(--accent-soft); }
  .countdown { justify-self: start; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--hairline); }
  .countdown.soon { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .countdown.urgent, .countdown.closed { background: var(--no-soft); color: var(--no); border-color: var(--no); }
  .progress-note { font-weight: 600; }
  .waiting { margin-top: -8px; }
  .whip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-top: 8px; border-top: 1px solid var(--hairline); }
  .whip-row .named { flex-basis: 100%; font-size: 14px; color: var(--ink-2); }
  .whip-row .whip-motion { font-weight: 600; color: var(--ink); }
  .chat-list { max-height: 320px; overflow-y: auto; }
  .chat-list li { display: grid; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); max-width: 85%; justify-self: start; }
  .chat-list li.mine { justify-self: end; background: var(--accent-soft); }
  .chat-meta { font-size: 12px; color: var(--muted); }
  .chat-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .party-option.full { opacity: 0.55; }
  .muted-badge { color: var(--muted); background: var(--surface-2); }
  .links { display: grid; gap: 10px; padding-top: 8px; }
  .links button { margin-top: 6px; }
  .chat-link { justify-self: start; color: var(--accent); font-weight: 600; margin-top: -8px; }
  #party-chat { scroll-margin-top: 150px; }

  .poll-trend { display: grid; gap: 10px; }
  .poll-row { display: grid; grid-template-columns: 70px 1fr 44px; gap: 4px 8px; align-items: center; font-size: 13px; }
  .poll-row.mine .party-tag { text-decoration: underline; text-underline-offset: 3px; }
  .poll-track { position: relative; overflow: visible; height: 14px; }
  .poll-track i { border-radius: 0 4px 4px 0; }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px solid var(--ink); transform: translateX(-1px); }
  .tick.previous { border-left: 2px dashed var(--muted); }
  .poll-changes { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  .chg { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--yes); } .chg.down { color: var(--no); } .chg.flat { color: var(--muted); }
  .poll-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-tick { display: inline-block; width: 0; height: 12px; border-left: 2px solid var(--ink); }
  .legend-tick.previous { border-left: 2px dashed var(--muted); }
  .poll-peek { font-weight: 500; }

  /* ---- the four rooms ---- */
  .rooms { --nav-h: 64px; }
  .room-page { padding-bottom: calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
  .rooms .sticky-actions { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
  .roomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--hairline); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .roomtab { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; min-height: var(--nav-h); border: none; border-radius: 0;
    background: none; color: var(--muted); font-size: 11px; font-weight: 600; }
  .roomtab:hover:not(:disabled) { border: none; color: var(--ink-2); }
  .roomtab.here { color: var(--accent); }
  .roomtab.here .roomicon::after { content: ""; position: absolute; left: 50%; top: -9px; width: 28px; height: 3px; margin-left: -14px; border-radius: 0 0 3px 3px; background: var(--accent); }
  .roomicon { position: relative; width: 26px; height: 26px; }
  .roomicon svg { width: 26px; height: 26px; fill: currentColor; display: block; }
  .dot-new { position: absolute; top: -2px; right: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--no); border: 2px solid var(--surface); }
  .roomlabel { line-height: 1.1; text-align: center; }
  .room-note { margin-top: -8px; }
  .section-title { font-family: var(--display); font-size: 21px; font-weight: 700; margin: 8px 0 4px; }
  .briefing, .results { display: grid; gap: 12px; }
  .inbox { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .inbox li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline); }
  .inbox li:last-child { border-bottom: none; padding-bottom: 0; }
  .inbox button.link { white-space: nowrap; flex: none; }
  .small { font-size: 13px; }
  button.link.small { font-size: 13px; padding: 0; }
  .advice-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .chip.yes { background: var(--yes-soft); color: var(--yes); }
  .chip.no { background: var(--no-soft); color: var(--no); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.strong.yes { background: var(--yes); color: #fff; }
  .chip.strong.no { background: var(--no); color: #fff; }
  .motion.compact h3 { font-size: 19px; }
  details.result summary { cursor: pointer; display: grid; gap: 4px; list-style: none; }
  details.result summary::-webkit-details-marker { display: none; }
  details.result summary::after { content: "Show why ▾"; font-size: 13px; font-weight: 600; color: var(--accent); }
  details.result[open] summary::after { content: "Hide ▴"; }
  .result-line { font-weight: 600; }
  .outcome-row { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .outcome-text { font-weight: 600; }
  .members { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .members li { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 8px 10px; border-radius: 8px; }
  .members li:nth-child(odd) { background: var(--surface-2); }
  .members li.mine { outline: 2px solid var(--accent); outline-offset: -2px; }
  .member-name { font-weight: 600; font-size: 15px; }
  .member-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); align-self: center; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--hairline); }
  .member-tag.human { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .member-sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .who-voted { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 8px 0 0; }
  .who-voted dt { font-weight: 700; white-space: nowrap; }
  .who-voted dd { margin: 0; color: var(--ink-2); }
  .fold-all { margin-top: 10px; }
  .fold-all summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); padding: 6px 0; }
  .fold-all[open] summary { margin-bottom: 6px; }
  .ranking { list-style: none; margin: 0; padding: 0; display: grid; }
  .ranking li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 14px; }
  .ranking li:nth-child(odd) { background: var(--surface-2); }
  .ranking li.mine { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
  .ranking li.at-risk { background: var(--no-soft); color: var(--no); }
  .rank-no, .rank-score { font-variant-numeric: tabular-nums; }
  .rank-no { color: var(--muted); }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .board h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .board ol { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14px; }
  .board li { display: list-item; }
  .board li.mine { font-weight: 700; }
  .board-val { float: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .announcement .page { padding-bottom: 120px; }

  /* ---- compact rooms layout ---- */
  .topbar.slim { padding: 6px 12px 6px; gap: 4px; }
  .topbar.slim .topline { align-items: center; }
  .topbar.slim .countdown { font-size: 12px; padding: 2px 9px; }
  .slimscores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 680px; width: 100%; margin: 0 auto; }
  .slim { display: grid; line-height: 1.15; min-width: 0; }
  .slim .label { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .slim b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .slim .meter { display: block; height: 3px; margin-top: 2px; }
  .rooms .room-page { gap: 12px; padding-top: 10px; }
  .roomhead { display: grid; gap: 6px; }
  .roomhead-line { display: flex; align-items: center; gap: 8px; }
  .roomhead-line h2 { font-size: 22px; }
  .audience { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .roomhead-line .where { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .info-btn { width: 24px; height: 24px; padding: 0; border-radius: 50%; font: italic 700 13px/1 Georgia, serif; color: var(--muted); }
  .info-btn.on { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
  .room-info { font-size: 14px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; }
  .subtabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; padding: 3px; }
  .subtab { flex: 1 1 0; position: relative; padding: 8px 4px; font-size: 13px; border: none; border-radius: 7px; background: none; color: var(--ink-2); }
  .subtab:hover:not(:disabled) { border: none; }
  .subtab.here { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .dot-new.small { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-width: 0; }
  .tab-title { font-weight: 600; font-size: 15px; }
  .empty { padding: 24px 4px; text-align: center; }
  .notice p { margin-bottom: 4px; }
  /* deck */
  .deck { display: grid; gap: 10px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .step { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 14px; font-weight: 700; }
  .step.here { outline: 3px solid var(--s1); outline-offset: 1px; }
  .step.for { background: var(--yes); border-color: var(--yes); color: #fff; }
  .step.against { background: var(--no); border-color: var(--no); color: #fff; }
  .step.abstain { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
  .step-note { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .deck-card { gap: 10px; }
  .deck-card .deck-text { font-family: var(--display); font-size: 23px; line-height: 1.2; }
  .weight-text { font-size: 13px; margin-top: -4px; }
  .adv-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .adv-badge { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 600; line-height: 1.15; min-width: 0; }
  .adv-badge small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adv-badge .avatar { width: 24px; height: 24px; font-size: 9px; flex: none; }
  .adv-badge.yes { background: var(--yes-soft); color: var(--yes); } .adv-badge.yes .avatar { background: var(--yes); color: #fff; }
  .adv-badge.no { background: var(--no-soft); color: var(--no); } .adv-badge.no .avatar { background: var(--no); color: #fff; }
  .adv-badge.warn { background: var(--warn-soft); color: var(--warn); } .adv-badge.warn .avatar { background: var(--warn); color: #fff; }
  details.why summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  details.why[open] summary { margin-bottom: 8px; }
  .deck-nav { display: flex; justify-content: space-between; }
  .deck-nav button:disabled { visibility: hidden; }
  .deck-foot { text-align: center; }
  .deck-nav .next { font-size: 14px; padding: 8px 14px; }
  .deck-nav .next.ready { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .press-room { display: grid; gap: 12px; }
  .press-hero { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 14px 12px; border-radius: 12px; background: var(--surface-2); }
  .press-hero h3 { font-family: var(--display); font-size: 24px; }
  .press-hero p { font-size: 14px; color: var(--ink-2); max-width: 34em; }
  .press-count { font-weight: 700; color: var(--accent) !important; }
  .press-art { width: 200px; height: 75px; }
  .press-art .stand { fill: var(--axis); }
  .press-art .head { fill: var(--ink); }
  .press-art .m1 .flag { fill: var(--s1, #2f6fd6); } .press-art .m2 .flag { fill: var(--accent); } .press-art .m3 .flag { fill: var(--s3, #1e9b6b); }
  .press-art .flash { stroke: var(--warn); stroke-width: 3; stroke-linecap: round; }
  .press-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .press-row { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairline); }
  .press-row.on { border: 2px solid var(--accent); }
  .press-motion { display: grid; gap: 2px; }
  .press-no { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .press-text { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .press-vote { font-size: 13px; color: var(--ink-2); }
  .press-effect { font-size: 13px; color: var(--ink-2); margin: 0; }
  .press-row.news .press-effect b { color: var(--yes); }
  .press-row button { justify-self: start; }

  /* compact rows */
  .rows { display: grid; gap: 6px; }
  .row-fold { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 8px 10px; }
  .row-fold > summary { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
  .row-fold > summary::-webkit-details-marker { display: none; }
  .row-fold[open] > summary { margin-bottom: 8px; }
  .row-fold[open] .row-open { transform: rotate(180deg); }
  .row-fold > *:not(summary) { margin-top: 6px; }
  .row-main { display: grid; gap: 3px; min-width: 0; }
  .row-text { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .row-fold:not([open]) .row-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row-open { color: var(--muted); font-size: 12px; transition: transform 0.15s; }
  .mark { display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 8px; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
  .mark.yes { background: var(--yes); color: #fff; } .mark.no { background: var(--no); color: #fff; }
  .mark.num.for { background: var(--yes); color: #fff; } .mark.num.against { background: var(--no); color: #fff; } .mark.num.abstain { background: var(--ink-2); color: var(--surface); }
  .minibar { display: inline-flex; width: 90px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--hairline); }
  .minibar i { display: block; height: 100%; }
  .minibar .yes { background: var(--yes); } .minibar .no { background: var(--no); } .minibar .abs { background: var(--ink-2); } .minibar .miss { background: var(--axis); }
  .party-votes { gap: 3px; }
  .pv { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 4px; color: #fff; }
  .pv.yes { background: var(--yes); } .pv.no { background: var(--no); }
  .delta-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .dchip { display: grid; justify-items: center; padding: 6px 2px; border-radius: 8px; background: var(--surface-2); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .dchip small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .dchip.up { color: var(--yes); } .dchip.down { color: var(--no); }
  .desk-now { display: grid; gap: 6px; }
  .desk-now button { justify-self: start; }
  .card h3 + p { margin-top: -4px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .pill.here { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .risk-note { font-size: 14px; color: var(--ink-2); }
  .risk-note.danger { color: var(--no); font-weight: 600; }
  .chat-list.tall { max-height: 55vh; }
  .chat-input { position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); background: var(--page); padding-top: 6px; }
  @media (max-width: 480px) {
    .page { padding-inline: 12px; }
    .card { padding: 12px; gap: 10px; border-radius: 10px; }
    .motion h3 { font-size: 19px; }
  }

  .roomhead-line { flex-wrap: wrap; row-gap: 2px; }
  .roomhead-line h2 { white-space: nowrap; }
  .audience { font-size: 10px; white-space: nowrap; }
  .notice-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 14px;
    background: var(--no-soft); border-color: var(--no); color: var(--no); padding: 10px 12px; }
  .notice-line span { font-size: 20px; line-height: 1; }

  /* ---- the cut scene after each session ---- */
  .cutscene { --cs-bg: #161112; --cs-ink: #f6f1f0; --cs-muted: #a89c9d; --cs-line: #3a3132; --cs-up: #4cc07e; --cs-down: #f07a80; --cs-card: #211a1b;
    position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(120% 80% at 50% 0%, #3a1418 0%, var(--cs-bg) 60%);
    color: var(--cs-ink); display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .cutscene > * { width: 100%; max-width: 560px; margin: 0 auto; }
  .cs-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cs-muted); }
  .cs-skip { background: none; border: 1px solid var(--cs-line); color: var(--cs-muted); padding: 5px 12px; font-size: 12px; }
  .cs-steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .cs-step { background: none; border: none; border-top: 3px solid var(--cs-line); border-radius: 0; color: var(--cs-muted); font-size: 12px; padding: 6px 0 0; text-align: left; }
  .cs-step.done { border-top-color: #8a2a33; color: var(--cs-ink); }
  .cs-step.here { border-top-color: #e5535d; color: var(--cs-ink); }
  .cs-scene { display: grid; gap: 14px; align-content: start; animation: cs-in 0.45s ease-out; }
  @keyframes cs-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .cs-kicker { font-size: 13px; color: var(--cs-muted); }
  .cs-title { font-family: var(--display); font-size: clamp(28px, 8vw, 40px); line-height: 1.08; color: var(--cs-ink); }
  .cs-scores { display: grid; gap: 8px; }
  .cs-score { display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 4px 14px; padding: 12px 14px; border-radius: 12px; background: var(--cs-card); border: 1px solid var(--cs-line); }
  .cs-label { font-size: 13px; color: var(--cs-muted); }
  .cs-num { font-family: var(--display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
  .cs-num.big { font-size: 56px; line-height: 1; }
  .cs-delta { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--cs-muted); min-width: 48px; text-align: right; }
  .up .cs-delta, .cs-delta.up { color: var(--cs-up); }
  .down .cs-delta, .cs-delta.down { color: var(--cs-down); }
  .cs-meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--cs-line); overflow: hidden; }
  .cs-meter .fill { display: block; height: 100%; background: var(--cs-up); transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .cs-poll { display: grid; gap: 9px; }
  .cs-poll-row { display: grid; grid-template-columns: 54px 1fr 34px 30px 30px 46px; align-items: center; gap: 6px; font-size: 13px; }
  .cs-poll.one-base .cs-poll-row { grid-template-columns: 58px 1fr 38px 32px 50px; gap: 7px; }
  .cs-track { position: relative; }
  .cs-election-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--cs-ink); opacity: 0.85; border-radius: 1px; }
  .cs-legend { font-size: 12px; color: var(--cs-muted); display: flex; align-items: center; gap: 6px; }
  .cs-legend-tick { display: inline-block; width: 2px; height: 14px; background: var(--cs-ink); opacity: 0.85; }
  .cs-poll-row .party-tag { color: var(--cs-ink); min-width: 0; }
  .cs-poll-row.mine { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 4px 6px; margin: 0 -6px; }
  .cs-poll-row.mine .party-tag { text-decoration: underline; text-underline-offset: 3px; }
  .cs-track { height: 16px; border-radius: 0 5px 5px 0; background: var(--cs-line); overflow: hidden; }
  .cs-track .fill { display: block; height: 100%; background: var(--pc); transition: width 1.2s cubic-bezier(.2,.7,.2,1); }
  .cs-pct { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .cs-ranks { display: grid; gap: 10px; }
  .cs-rank { display: grid; gap: 4px; padding: 16px; border-radius: 14px; background: var(--cs-card); border: 1px solid var(--cs-line); }
  .cs-rank-line small { font-size: 16px; color: var(--cs-muted); }
  .cs-risk { font-size: 15px; font-weight: 600; padding: 12px 14px; border-radius: 12px; }
  .cs-risk.danger { background: rgba(240,122,128,0.15); color: var(--cs-down); }
  .cs-risk.safe { background: rgba(76,192,126,0.12); color: var(--cs-up); }
  .cs-lede { font-size: 16px; line-height: 1.45; color: var(--cs-ink); opacity: 0.85; }
  .cs-intro { justify-items: center; text-align: center; align-content: center; min-height: 52vh; }
  .cs-intro .cs-title { font-size: clamp(32px, 10vw, 48px); }
  .cs-ballot { width: 120px; height: 110px; overflow: visible; }
  .cs-ballot .box { fill: #3a1418; stroke: #e5535d; stroke-width: 2.5; }
  .cs-ballot .slot { fill: #0d0909; }
  .cs-ballot .band { stroke: #e5535d; stroke-width: 3; stroke-linecap: round; opacity: 0.6; }
  .cs-ballot .paper { fill: #f6f1f0; }
  .cs-ballot .paper-lines { stroke: #a89c9d; stroke-width: 3; stroke-linecap: round; }
  .cs-ballot .drop { animation: cs-drop 1.4s cubic-bezier(.5,0,.7,.4) 0.3s forwards; }
  @keyframes cs-drop { 0% { transform: translateY(-14px); opacity: 0; } 25% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(46px); opacity: 1; } }
  .cs-motions { display: grid; gap: 10px; }
  .cs-motion { display: grid; gap: 7px; padding: 12px 14px; border-radius: 12px; background: var(--cs-card); border: 1px solid var(--cs-line); opacity: 0; animation: cs-in 0.4s ease-out var(--d, 0s) forwards; }
  .cs-motion-top { display: flex; justify-content: space-between; align-items: center; }
  .cs-motion-no { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cs-muted); }
  .cs-stamp { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border: 2px solid currentColor; border-radius: 6px; transform: rotate(-4deg); animation: cs-stamp 0.35s cubic-bezier(.3,1.6,.5,1) calc(var(--d, 0s) + 0.25s) both; }
  .passed .cs-stamp { color: var(--cs-up); }
  .rejected .cs-stamp { color: var(--cs-down); }
  @keyframes cs-stamp { from { transform: rotate(-4deg) scale(2.2); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
  .cs-motion-text { font-size: 14px; line-height: 1.35; color: var(--cs-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cs-tally { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--cs-line); }
  .cs-tally i { display: block; height: 100%; }
  .cs-tally .for { background: var(--cs-up); }
  .cs-tally .against { background: var(--cs-down); }
  .cs-tally .abstain { background: var(--cs-muted); }
  .cs-tally-nums { display: flex; gap: 12px; font-size: 12px; color: var(--cs-muted); font-variant-numeric: tabular-nums; }
  .cs-tally-nums .for { color: var(--cs-up); }
  .cs-tally-nums .against { color: var(--cs-down); }
  .cs-you { font-size: 13px; color: var(--cs-muted); border-top: 1px solid var(--cs-line); padding-top: 7px; }
  .cs-you.won { color: var(--cs-ink); }
  .cs-poll-row.cs-poll-head { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cs-muted); }
  .cs-poll-head span:nth-child(n+3) { text-align: right; }
  .cs-poll-row .cs-delta { min-width: 0; font-size: 12px; }
  .cs-seats { display: flex; justify-content: flex-end; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
  .cs-seat-num { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .cs-seats small { font-size: 11px; font-weight: 700; color: var(--cs-muted); min-width: 22px; }
  .cs-seats.up small { color: var(--cs-up); }
  .cs-seats.down small { color: var(--cs-down); }
  .cs-hemi { display: grid; gap: 4px; justify-items: center; }
  .cs-hemi svg { width: 100%; max-width: 320px; height: auto; }
  .cs-hemi .seat { stroke: var(--cs-bg); }
  .cs-hemi p { font-size: 12px; color: var(--cs-muted); }
  .cs-actions button { width: 100%; padding: 15px; font-size: 16px; }
  .cutscene .cs-actions .primary { background: #e5535d; border-color: #e5535d; color: #1a0d0e; }
  @media (prefers-reduced-motion: reduce) { .cs-scene, .cs-motion, .cs-stamp, .cs-ballot .drop { animation: none; opacity: 1; } .cs-track .fill, .cs-meter .fill { transition: none; } }
</style>
</head>
